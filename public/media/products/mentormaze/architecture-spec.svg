<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#0D1117"/>
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top Banner / Header -->
  <rect x="60" y="40" width="1080" height="64" rx="8" fill="#161B22" stroke="#30363D"/>
  <text x="90" y="78" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.05em">MENTORMAZE // ARCHITECTURAL SPECIFICATION</text>
  <rect x="880" y="56" width="230" height="32" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.4"/>
  <text x="995" y="77" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">CONCEPTUAL PROTOTYPE SPEC</text>

  <!-- Left: Socratic AST Evaluation Pipeline -->
  <g transform="translate(60, 130)">
    <rect width="520" height="480" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="32" y="44" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Cognitive Prerequisite Diagnosis &amp; AST Analysis</text>
    <text x="32" y="68" fill="#8B949E" font-family="ui-monospace, monospace" font-size="12">Stage 1: Multi-Turn Syntax Tree Disassembly</text>

    <!-- Node 1 -->
    <rect x="32" y="100" width="456" height="68" rx="8" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-opacity="0.5"/>
    <text x="56" y="130" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="12" font-weight="600">INPUT: PyTorch / Triton CUDA Kernel Snippet</text>
    <text x="56" y="152" fill="#6B7280" font-family="ui-monospace, monospace" font-size="11">AST Tokens -> Directed Acyclic Dependency Lattices</text>

    <!-- Connector -->
    <path d="M 260 168 L 260 196" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 2 -->
    <rect x="32" y="196" width="456" height="80" rx="8" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <text x="56" y="226" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SOCRATIC ENGINE: Anti-Pattern Classifier</text>
    <text x="56" y="248" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">Identifies stride mismatch &amp; race conditions without giving direct answers</text>
    <text x="56" y="266" fill="#6B7280" font-family="ui-monospace, monospace" font-size="10">Target Latency: &lt; 350ms per token intervention</text>

    <!-- Connector -->
    <path d="M 260 276 L 260 304" stroke="#10B981" stroke-width="2"/>

    <!-- Node 3 -->
    <rect x="32" y="304" width="456" height="76" rx="8" fill="url(#nodeGrad)" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="56" y="334" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" font-weight="600">PEDAGOGICAL INTERVENTION DISPATCH</text>
    <text x="56" y="356" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">Interactive mathematical proofs &amp; memory-stride visualization</text>

    <!-- Provenance Footer -->
    <rect x="32" y="408" width="456" height="44" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="260" y="435" fill="#6E7681" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Formal Verification Target: Lean 4 Theorem Prover Integration</text>
  </g>

  <!-- Right: Isolated Container Sandbox -->
  <g transform="translate(620, 130)">
    <rect width="520" height="480" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="32" y="44" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">gVisor Sandboxed Execution &amp; Memory Safety</text>
    <text x="32" y="68" fill="#8B949E" font-family="ui-monospace, monospace" font-size="12">Stage 2: Deterministic CUDA Memory Profiling</text>

    <!-- Container Box -->
    <rect x="32" y="100" width="456" height="280" rx="8" fill="#0D1117" stroke="#484F58" stroke-dasharray="6 4"/>
    <text x="56" y="132" fill="#F3F4F6" font-family="ui-monospace, monospace" font-size="12" font-weight="600">[SECURE ENCLAVE] Isolated gVisor RunSC Kernel</text>

    <rect x="56" y="152" width="408" height="54" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="76" y="176" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11">eBPF Syscall Filter: Block raw network &amp; unauthenticated IO</text>
    <text x="76" y="194" fill="#9CA3AF" font-family="ui-monospace, monospace" font-size="10">Active Filters: sys_ptrace, sys_clone3, sys_bpf blocked</text>

    <rect x="56" y="218" width="408" height="54" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="76" y="242" fill="#E5E7EB" font-family="ui-monospace, monospace" font-size="11">GPU Memory Profiler: Stride-by-stride coalescing check</text>
    <text x="76" y="260" fill="#9CA3AF" font-family="ui-monospace, monospace" font-size="10">Hardware Target: NVIDIA L4 / A100 Isolated VM Slice</text>

    <rect x="56" y="284" width="408" height="80" rx="6" fill="#161B22" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="76" y="308" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="11" font-weight="600">OUTPUT: Real-Time Socratic Diagnostic Ledger</text>
    <text x="76" y="328" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">Execution telemetry streams to student editor via binary WebSockets</text>
    <text x="76" y="348" fill="#6B7280" font-family="ui-monospace, monospace" font-size="10">100% Deterministic &bull; Zero Host Memory Contamination</text>

    <!-- Watermark / Provenance -->
    <rect x="32" y="408" width="456" height="44" rx="6" fill="#0D1117" stroke="#8B5CF6" stroke-opacity="0.4"/>
    <text x="260" y="435" fill="#A78BFA" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">[Authentic Architecture Specification &bull; MentorMaze Prototype]</text>
  </g>
</svg>
