<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#090D16"/>
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131C2E"/>
      <stop offset="100%" stop-color="#0B1322"/>
    </linearGradient>
    <pattern id="gridIris" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#gridIris)"/>

  <!-- Top Banner / Header -->
  <rect x="60" y="40" width="1080" height="64" rx="8" fill="#131C2E" stroke="#1E293B"/>
  <text x="90" y="78" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.05em">IRIS // 3D SPATIAL OCCUPANCY &amp; PERCEPTUAL MEMORY ENGINE</text>
  <rect x="880" y="56" width="230" height="32" rx="6" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-opacity="0.4"/>
  <text x="995" y="77" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">ROBOTICS SPECIFICATION [PROTOTYPE]</text>

  <!-- Left: Continuous 3D Voxel Memory -->
  <g transform="translate(60, 130)">
    <rect width="520" height="480" rx="12" fill="#131C2E" stroke="#1E293B"/>
    <text x="32" y="44" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Egocentric 3D Voxel Tensor Buffer</text>
    <text x="32" y="68" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">Stage 1: Multi-Modal Temporal Fusion</text>

    <!-- Node 1 -->
    <rect x="32" y="100" width="456" height="72" rx="8" fill="url(#cardGrad)" stroke="#0284C7" stroke-opacity="0.5"/>
    <text x="56" y="130" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SENSORY INPUT: RGB-D + VIO Odometry + IMU</text>
    <text x="56" y="152" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">Continuous 60 FPS Camera Streams &bull; Depth Latents</text>

    <!-- Connector -->
    <path d="M 260 172 L 260 200" stroke="#14B8A6" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 2 -->
    <rect x="32" y="200" width="456" height="84" rx="8" fill="url(#cardGrad)" stroke="#14B8A6" stroke-opacity="0.6"/>
    <text x="56" y="230" fill="#5EEAD4" font-family="ui-monospace, monospace" font-size="12" font-weight="600">VOXEL MEMORY: 3D Occupancy Projection</text>
    <text x="56" y="252" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">Resolves frame-forgetting: maintains object permanence during occlusions</text>
    <text x="56" y="270" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Voxel Grid Resolution: 256^3 &bull; Explicit Uncertainty Bounds</text>

    <!-- Connector -->
    <path d="M 260 284 L 260 312" stroke="#10B981" stroke-width="2"/>

    <!-- Node 3 -->
    <rect x="32" y="312" width="456" height="76" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="56" y="342" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" font-weight="600">AFFORDANCE GROUNDING &amp; TRAJECTORY TARGETS</text>
    <text x="56" y="364" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Outputs collision-free bounding volumes &amp; grasping vectors</text>

    <!-- Provenance Footer -->
    <rect x="32" y="408" width="456" height="44" rx="6" fill="#0B1322" stroke="#1E293B"/>
    <text x="260" y="435" fill="#64748B" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Design Goal: 80+ FPS on Embedded Tensor Cores</text>
  </g>

  <!-- Right: Edge Silicon Execution -->
  <g transform="translate(620, 130)">
    <rect width="520" height="480" rx="12" fill="#131C2E" stroke="#1E293B"/>
    <text x="32" y="44" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Hardware Deployment &amp; Embedded Silicon Target</text>
    <text x="32" y="68" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">Stage 2: Quantized TensorRT-LLM Acceleration</text>

    <!-- Container Box -->
    <rect x="32" y="100" width="456" height="280" rx="8" fill="#0B1322" stroke="#334155" stroke-dasharray="6 4"/>
    <text x="56" y="132" fill="#F1F5F9" font-family="ui-monospace, monospace" font-size="12" font-weight="600">[HARDWARE TARGET] NVIDIA Jetson Orin AGX 64GB</text>

    <rect x="56" y="152" width="408" height="54" rx="6" fill="#131C2E" stroke="#1E293B"/>
    <text x="76" y="176" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11">FP8 / INT8 Quantized Voxel Occupancy Weights</text>
    <text x="76" y="194" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Target Power Envelope: &lt; 50W for Autonomous Mobile Robots</text>

    <rect x="56" y="218" width="408" height="54" rx="6" fill="#131C2E" stroke="#1E293B"/>
    <text x="76" y="242" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11">Zero-Copy Unified Memory Access (UMA)</text>
    <text x="76" y="260" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Eliminates PCIe Host-to-Device transfer bottleneck</text>

    <rect x="56" y="284" width="408" height="80" rx="6" fill="#131C2E" stroke="#14B8A6" stroke-opacity="0.3"/>
    <text x="76" y="308" fill="#5EEAD4" font-family="ui-monospace, monospace" font-size="11" font-weight="600">OUTPUT: Real-Time Spatial Safety Stream</text>
    <text x="76" y="328" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Direct integration with ROS 2 Nav2 &amp; MoveIt manipulation stacks</text>
    <text x="76" y="348" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Hardware-in-the-loop target verification stage</text>

    <!-- Watermark / Provenance -->
    <rect x="32" y="408" width="456" height="44" rx="6" fill="#0B1322" stroke="#14B8A6" stroke-opacity="0.4"/>
    <text x="260" y="435" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">[Authentic Architecture Specification &bull; Iris Perception Prototype]</text>
  </g>
</svg>
